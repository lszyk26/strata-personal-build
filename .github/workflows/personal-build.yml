name: personal-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build personal v1.0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Fetch pdfium (arm64)
        run: |
          set -eux
          curl -fsSL --retry 4 -o /tmp/p.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8086/pdfium-android-arm64.tgz"
          mkdir -p /tmp/px
          tar -xzf /tmp/p.tgz -C /tmp/px
          mkdir -p app/src/main/jniLibs/arm64-v8a native/third_party/pdfium/licenses
          cp /tmp/px/lib/libpdfium.so app/src/main/jniLibs/arm64-v8a/libpdfium.so
          cp /tmp/px/LICENSE /tmp/px/VERSION native/third_party/pdfium/
          cp /tmp/px/licenses/* native/third_party/pdfium/licenses/ || true
          mkdir -p app/src/main/assets/licenses/pdfium
          cp /tmp/px/licenses/* app/src/main/assets/licenses/pdfium/ || true
          cp /tmp/px/LICENSE app/src/main/assets/licenses/pdfium/pdfium-binaries.txt

      - name: Build the native core (arm64 only)
        run: |
          set -eux
          NDK="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          export ANDROID_NDK_HOME="$NDK"
          export CXXFLAGS_aarch64_linux_android="-D_POSIX_C_SOURCE=200809L"
          cd native
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
          find ../app/src/main/jniLibs -name 'libstrata_native.so'

      - name: Signing key (generated on the fly)
        run: |
          set -eux
          keytool -genkeypair -keystore release.jks -alias strata -keyalg RSA -keysize 4096 \
            -validity 10000 -storepass strata-personal-1 -keypass strata-personal-1 \
            -dname "CN=Strata Personal Build, OU=Personal, O=lszyk26, C=CN"
          printf 'storeFile=release.jks\nstorePassword=strata-personal-1\nkeyAlias=strata\nkeyPassword=strata-personal-1\n' > keystore.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Assemble release (fall back to debug)
        run: |
          mkdir -p logs
          if ./gradlew --stacktrace --no-daemon :app:assembleRelease > logs/release.log 2>&1; then
            echo "release=ok" | tee logs/status
          else
            echo "release=FAILED" | tee logs/status
            if ./gradlew --stacktrace --no-daemon :app:assembleDebug > logs/debug.log 2>&1; then
              echo "debug=ok" | tee -a logs/status
            else
              echo "debug=FAILED" | tee -a logs/status
            fi
          fi

      - name: Collect
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \; || true
          if ls out/*.apk >/dev/null 2>&1; then (cd out && sha256sum *.apk > SHA256SUMS.txt); fi
          ls -la out

      - name: Publish artifacts and the log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^strata.versionName=' gradle.properties | cut -d= -f2)
          mkdir -p out ci-logs
          tail -c 60000 logs/release.log > out/release.log || true
          tail -c 60000 logs/release.log > ci-logs/release.log || true
          if [ -f logs/debug.log ]; then tail -c 40000 logs/debug.log > out/debug.log; tail -c 40000 logs/debug.log > ci-logs/debug.log; fi
          cat logs/status
          git config user.email ci@local
          git config user.name ci
          git add -f ci-logs
          git commit -m "ci: build logs for run $GITHUB_RUN_ID" || true
          git push || true
          gh release delete "v${VERSION}-personal" --yes --cleanup-tag || true
          gh release create "v${VERSION}-personal" out/* \
            --title "Strata ${VERSION} personal build" \
            --notes "Unofficial personal build of CluvexStudio/Strata (AGPL-3.0), arm64. Version bumped to ${VERSION}; MIME table for office/html/archive formats fixed."
